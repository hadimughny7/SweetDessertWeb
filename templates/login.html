{% extends 'base.html' %}

{% block extra_css %}
<link rel="stylesheet" href="/static/login.css">
{% endblock %}

{% block content %}
<div class="container" style="margin-top: 140px; margin-bottom: 80px;" data-aos="fade-up">
    <div class="row align-items-center">
        <div class="col-md-6" data-aos="fade-right" data-aos-delay="200">
            <div class="image-container text-center">
                <img src="/static/Group 1.png" alt="Desserts" class="dessert-image img-fluid rounded shadow-sm">
            </div>
        </div>
        <div class="col-md-6" data-aos="fade-left" data-aos-delay="400">
            <div class="form-container p-5 bg-white rounded shadow" style="max-width: 450px; margin: 0 auto;">
                <h2 class="mb-3" style="font-weight: bold;">Staff Login</h2>
                <p class="text-muted mb-4">Enter your staff credentials</p>
                <form action="/staff" method="POST">
                    <div class="mb-3">
                        <input type="email" name="email" class="form-control" placeholder="Email Address" required style="padding: 12px;">
                    </div>
                    <div class="mb-4">
                        <input type="password" name="password" class="form-control" placeholder="Password" required style="padding: 12px;">
                    </div>
                    <button type="submit" class="btn btn-primary w-100" style="margin-top: 0; padding: 12px; font-weight: bold; font-size: 16px;">LOGIN</button>
                    <p class="text-center mt-4 mb-0">Need a staff account? <a href="/staff/register" style="color: #FBA1B7; text-decoration: none; font-weight: bold;">Register Here</a></p>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
