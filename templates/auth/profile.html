{% extends 'customer/base.html' %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/profile.css">
{% endblock %}

{% block content %}
<div class="container" style="margin-top: 100px; margin-bottom: 80px;" data-aos="fade-up">
    <section class="profile-container d-flex flex-column flex-md-row gap-4">
        <!-- Sidebar -->
        <aside class="sidebar bg-white p-4 rounded shadow-sm" style="min-width: 250px;">
            <div class="profile-wrapper text-center">
                <div class="clip mb-3">
                    <img src="/static/images/clip.png" alt="" width="50">
                </div>
                <div class="profile-title">
                    <h5 class="fw-bold mb-0">My Profile</h5>
                    <p class="text-muted small">Manage your staff account</p>
                </div>
            </div>
        </aside>

        <!-- Main Form -->
        <div class="profile-form bg-white p-5 rounded shadow-sm w-100">
            <h3 class="fw-bold mb-4">Edit Your Profile</h3>
            
            <form class="form" action="{{ url_for('update_profile') }}" method="POST">
                <div class="row g-4 mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Full Name</label>
                        <input type="text" name="username" class="form-control p-3" value="{{ user['username'] }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Email Address</label>
                        <input type="email" name="email" class="form-control p-3" value="{{ user['email'] }}" required>
                    </div>
                </div>

                <hr class="my-4">

                <h4 class="fw-bold mb-3">Password Changes</h4>
                <div class="row g-4 mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">New Password (Optional)</label>
                        <input type="password" name="password" class="form-control p-3" placeholder="Leave blank to keep current">
                    </div>
                </div>

                <div class="d-flex justify-content-end mt-4">
                    <button type="submit" class="btn btn-primary px-5 py-3 fw-bold" style="background-color: #FBA1B7; border: none; border-radius: 8px;">Save Changes</button>
                </div>
            </form>
        </div>
    </section>
</div>
{% endblock %}
