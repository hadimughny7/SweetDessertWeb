{% extends 'admin/admin_base.html' %}

{% block page_title %}Edit Product{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="dashboard-card p-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold m-0">Edit Product: {{ product.name }}</h4>
                <a href="{{ url_for('admin') }}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
            </div>
            
            <form method="POST" action="/admin/update/{{ product._id }}" enctype="multipart/form-data">
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label class="form-label text-muted fw-bold small">Product Name</label>
                        <input type="text" class="form-control" name="name" value="{{ product.name }}" required>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label class="form-label text-muted fw-bold small">Price (Rp)</label>
                        <input type="number" class="form-control" name="price" value="{{ product.price }}" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label text-muted fw-bold small">Description</label>
                    <textarea class="form-control" name="description" rows="4" required>{{ product.description }}</textarea>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label class="form-label text-muted fw-bold small">Category</label>
                        <select class="form-select" name="category" required>
                            {% for cat in categories %}
                            <option value="{{ cat.slug }}" {% if product.category == cat.slug %}selected{% endif %}>{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="col-md-6 mb-4">
                        <label class="form-label text-muted fw-bold small">Update Image (Optional)</label>
                        <input type="file" class="form-control" name="image" accept="image/*">
                        <div class="mt-3">
                            <span class="text-muted small d-block mb-2">Current Image:</span>
                            <img src="/{{ product.image|replace('\\', '/') }}" class="rounded shadow-sm" style="max-height: 100px; object-fit: cover;" onerror="this.style.display='none'">
                        </div>
                    </div>
                </div>
                
                <hr class="my-4">
                <button type="submit" class="btn btn-primary-pink w-100 py-3 rounded-pill fw-bold fs-5">Save Changes</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
