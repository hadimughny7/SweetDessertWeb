<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Dessert | Artisan Sweets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body data-bs-spy="scroll" data-bs-target="#pill-nav">
    
    <!-- Top Minimal Header (Logo only) -->
    <div class="container-fluid pt-4 pb-2 px-4 px-md-5 d-flex justify-content-between align-items-center position-absolute top-0 w-100" style="z-index: 10;">
        <div class="fw-bold" style="font-family: var(--font-display); font-size: 1.5rem; letter-spacing: 2px;">
            SWEET<span class="text-accent">DESSERT.</span>
        </div>
        <div class="section-label d-none d-md-flex">Est. 2024</div>
    </div>

    <!-- Floating Pill Navigation (Bottom Center) -->
    <nav id="pill-nav" class="pill-nav">
        <a class="nav-link" href="/#home">Home</a>
        <a class="nav-link" href="/#about">Story</a>
        <a class="nav-link" href="/#menu">Menu</a>
        <a class="nav-link" href="/#contact">Visit Us</a>
    </nav>

    <!-- Flash Messages (Toast system) -->
    <div id="toast-container" class="position-fixed" style="top: 80px; right: 5%; z-index: 9999; max-width: 90vw; width: max-content;">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="custom-alert mb-3" style="border-left: 4px solid var(--color-primary);">
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <!-- Main Content -->
    {% block content %}{% endblock %}

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 1000,
            once: true,
            offset: 50,
            easing: 'ease-out-cubic'
        });

        // Robust Scroll Active State using Intersection Observer
        document.addEventListener('DOMContentLoaded', () => {
            const sections = document.querySelectorAll('div[id]'); // All sections with IDs
            const navLinks = document.querySelectorAll('.pill-nav a');

            const observerOptions = {
                root: null,
                rootMargin: '-50% 0px -50% 0px', // Trigger when section is in the middle of viewport
                threshold: 0
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.getAttribute('id');
                        navLinks.forEach(link => {
                            link.classList.remove('active');
                            if (link.getAttribute('href') === `#${id}`) {
                                link.classList.add('active');
                            }
                        });
                    }
                });
            }, observerOptions);

            sections.forEach(section => {
                observer.observe(section);
            });
            
            // Allow native smooth scrolling to take over, but update active state immediately
            navLinks.forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    navLinks.forEach(a => a.classList.remove('active'));
                    this.classList.add('active');
                });
            });
        });
        
        // Auto-hide flash messages
        setTimeout(() => {
            const alerts = document.querySelectorAll('.custom-alert');
            alerts.forEach(alert => {
                alert.style.opacity = '0';
                alert.style.transition = 'opacity 0.5s ease';
                setTimeout(() => alert.remove(), 500);
            });
        }, 4000);
    </script>
</body>
</html>
