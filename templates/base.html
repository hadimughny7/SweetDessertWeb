<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Dessert | Artisan Sweets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body data-bs-spy="scroll" data-bs-target="#pill-nav">
    
    <!-- Top Minimal Header (Logo only) -->
    <div class="container-fluid pt-4 pb-2 px-5 d-flex justify-content-between align-items-center position-absolute top-0 w-100" style="z-index: 10;">
        <div class="fw-bold" style="font-family: var(--font-display); font-size: 1.5rem; letter-spacing: 2px;">
            SWEET<span class="text-accent">DESSERT.</span>
        </div>
        <div class="section-label d-none d-md-flex">Est. 2024</div>
    </div>

    <!-- Floating Pill Navigation (Bottom Center) -->
    <nav id="pill-nav" class="pill-nav">
        <a class="nav-link" href="#home">Home</a>
        <a class="nav-link" href="#about">Story</a>
        <a class="nav-link" href="#menu">Menu</a>
        <a class="nav-link" href="#contact">Visit Us</a>
    </nav>

    <!-- Flash Messages (Toast system) -->
    <div id="toast-container" style="position: fixed; top: 80px; right: 40px; z-index: 9999;">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="custom-alert mb-3" style="border-left: 4px solid var(--color-primary);">
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <!-- Main Content -->
    {% block content %}{% endblock %}

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 1000,
            once: true,
            offset: 50,
            easing: 'ease-out-cubic'
        });

        // Smooth scroll for nav links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    // Update active state manually for immediate feedback
                    document.querySelectorAll('.pill-nav a').forEach(a => a.classList.remove('active'));
                    this.classList.add('active');

                    const elementPosition = target.getBoundingClientRect().top;
                    const offsetPosition = elementPosition + window.pageYOffset;
  
                    window.scrollTo({
                         top: offsetPosition,
                         behavior: "smooth"
                    });
                }
            });
        });
        
        // Auto-hide flash messages
        setTimeout(() => {
            const alerts = document.querySelectorAll('.custom-alert');
            alerts.forEach(alert => {
                alert.style.opacity = '0';
                alert.style.transition = 'opacity 0.5s ease';
                setTimeout(() => alert.remove(), 500);
            });
        }, 4000);
    </script>
</body>
</html>
